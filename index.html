<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a10">
  <title>DIMAGI NAXAL — Public Record Directory</title>
  <style>
    :root{color-scheme:dark;--bg:#07090f;--panel:#111620;--line:#292f3c;--red:#ff354d;--cyan:#49d8ff;--text:#f4f6fb;--muted:#a5adbd}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b0c16 0,#080a10 45%,#05060a 100%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    header{text-align:center;padding:28px 16px 18px;border-bottom:1px solid #391721;background:#090b12d9;position:sticky;top:0;z-index:2;backdrop-filter:blur(12px)}
    h1{margin:0;color:var(--red);font-size:clamp(22px,5vw,32px);letter-spacing:.12em;text-shadow:0 0 20px #ff354d55}
    .sub{color:var(--muted);margin:5px 0 0;font-size:13px}
    main{max-width:1000px;margin:0 auto;padding:20px 14px 60px}
    .notice{border:1px solid #343a49;border-radius:14px;padding:12px 14px;color:#c8cfdd;background:#10141d;margin-bottom:20px;font-size:13px}
    .search{width:100%;padding:14px 15px;border:1px solid #343b4a;border-radius:12px;background:#0d1119;color:var(--text);font:inherit;outline:none;margin-bottom:24px}
    .search:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #49d8ff20}
    .category{margin:28px 0}.category h2{color:var(--cyan);font-size:17px;letter-spacing:.08em;margin:0 0 12px;text-transform:uppercase}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
    .person{display:block;padding:18px 16px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#121722,#0c1017);text-decoration:none;color:inherit;min-height:100px;transition:transform .15s,border-color .15s,box-shadow .15s}
    .person:hover,.person:focus-visible{transform:translateY(-2px);border-color:var(--red);box-shadow:0 0 22px #ff354d18;outline:none}
    .person h3{margin:0 0 5px;font-size:18px;overflow-wrap:anywhere}.person .role{color:var(--red);font-weight:650;font-size:13px;margin:0 0 7px}.person .summary{color:var(--muted);font-size:13px;margin:0}
    .hint{color:#8c96a9;font-size:12px;margin-top:10px}.empty{color:var(--muted);padding:20px;text-align:center}
    footer{text-align:center;color:#747e91;padding:25px 12px;border-top:1px solid #1e2430;font-size:12px}
  </style>
</head>
<body>
  <header>
    <h1>DIMAGI NAXAL</h1>
    <p class="sub">Public statements, commentary and source documentation</p>
  </header>
  <main>
    <div class="notice">📚 Research directory: review original sources and context. Distinguish verified facts, allegations and opinions; political criticism alone does not establish wrongdoing.</div>
    <input id="search" class="search" type="search" placeholder="Search names or categories…" aria-label="Search names or categories">
    <div id="directory"></div>
  </main>
  <footer>Keep entries factual, sourced, and respectful of privacy.</footer>
  <script src="data.js"></script>
  <script>
    // data.js defines window.SITE_DATA. No build tools or server-side code required.
    const directory = document.getElementById('directory');
    const search = document.getElementById('search');
    let records = [];
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function render() {
      const term = search.value.trim().toLowerCase();
      const categories = records.map(cat => ({...cat, people:(cat.people||[]).filter(p =>
        [p.name,p.role,p.summary,cat.name].some(v => String(v||'').toLowerCase().includes(term))
      )})).filter(cat => cat.people.length);
      if (!categories.length) { directory.innerHTML = '<p class="empty">No matching names found.</p>'; return; }
      directory.innerHTML = categories.map(cat => `
        <section class="category">
          <h2>${esc(cat.name)}</h2>
          <div class="cards">${cat.people.map(person => {
            const url = String(person.pastebinUrl || '').trim();
            const href = url || '#';
            const hint = url ? '↗ Open evidence on Pastebin' : 'Add a Pastebin URL in data.js';
            return `<a class="person" href="${esc(href)}" ${url ? 'target="_blank" rel="noopener noreferrer"' : 'data-unlinked="true"'} data-name="${esc(person.name)}">
              <h3>${esc(person.name)} ${url ? '↗' : ''}</h3>
              <p class="role">${esc(person.role || cat.name)}</p>
              <p class="summary">${esc(person.summary || 'Add a short, sourced description.')}</p>
              <p class="hint">${esc(hint)}</p>
            </a>`;
          }).join('')}</div>
        </section>`).join('');
      directory.querySelectorAll('[data-unlinked="true"]').forEach(link => link.addEventListener('click', e => {
        e.preventDefault();
        alert('Paste your Pastebin URL into this person’s "pastebinUrl" field in data.js first.');
      }));
    }
    try {
      records = (window.SITE_DATA && window.SITE_DATA.categories) || [];
      render();
    } catch (error) {
      directory.innerHTML = '<p class="empty">Could not load data.js. Check that data.js is committed beside index.html.</p>';
    }
    search.addEventListener('input', render);
  </script>
</body>
</html>
