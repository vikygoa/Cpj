<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111b"><title>Profile · Network Evidence Map</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#1b2b3a,#07111b 62%);color:#f5f7fa;font-family:system-ui,Arial,sans-serif}header{padding:13px;background:#07111bf2;border-bottom:1px solid #2a4053}a{color:#8ed8ff}main{max-width:760px;margin:auto;padding:14px}.panel{background:#101f2d;border:1px solid #2a4053;border-radius:13px;padding:15px;margin:12px 0}.kind{font-size:10px;color:#ff6670;text-transform:uppercase;font-weight:900;letter-spacing:1px}.symbol{font-size:35px}.title{font-size:25px;margin:4px 0}.muted{color:#a8bac8;font-size:12px;line-height:1.6}.pill{display:inline-block;padding:5px 8px;border-radius:6px;background:#302a1c;color:#ffdf9b;font-size:11px}.source,.connection{display:block;border:1px solid #344b60;border-radius:9px;padding:11px;margin:8px 0;color:#f7f9fb;text-decoration:none;overflow-wrap:anywhere}.source small,.connection small{display:block;color:#a8bac8;margin-top:5px;font-size:10px}.btn{display:inline-block;padding:9px 12px;background:#132536;border:1px solid #3b5369;border-radius:8px;color:white;text-decoration:none;font-size:12px;font-weight:800}.back{display:inline-block;margin:10px 0}.label{font-size:13px;font-weight:900;margin:0 0 8px}</style></head><body><header><b>NETWORK <span style="color:#ff4656">EVIDENCE MAP</span></b></header><main><a class="back" href="./">← Back to map</a><section class="panel"><div class="symbol" id="symbol">●</div><div class="kind" id="kind">Profile</div><h1 class="title" id="name">Loading profile…</h1><div class="muted" id="role"></div><p><span class="pill" id="status">Status not added</span></p><p id="overview"></p><a class="btn" id="sourceButton" href="#" target="_blank" rel="noopener" hidden>Open primary source ↗</a></section><section class="panel"><h2 class="label">Documented connections</h2><div id="connections" class="muted">No connections added.</div></section><section class="panel"><h2 class="label">Evidence / source records</h2><div class="muted" id="sourceCount"></div><div id="evidence"></div></section><section class="panel"><h2 class="label">Context and limitations</h2><p class="muted" id="limitations">Add context for what the evidence does and does not establish.</p></section></main><script>
const defaults={'main-network':{name:'Main topic',kind:'Overview',symbol:'🌐',role:'Central profile',overview:'Define the topic and its scope.'}};const id=new URLSearchParams(location.search).get('id')||'main-network';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function safeUrl(s){try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}function render(d){document.title=(d.name||'Profile')+' · Network Evidence Map';document.getElementById('symbol').textContent=d.symbol||'●';document.getElementById('kind').textContent=d.kind||'Profile';document.getElementById('name').textContent=d.name||'Profile';document.getElementById('role').textContent=d.role||'';document.getElementById('status').textContent=d.status||'Status not added';document.getElementById('overview').textContent=d.overview||'No background information added yet.';const u=safeUrl(d.url||'');const sb=document.getElementById('sourceButton');if(u){sb.href=u;sb.hidden=false}document.getElementById('connections').innerHTML=(d.connections||[]).length?d.connections.map(c=>`<a class="connection" href="profile.html?id=${encodeURIComponent(c.id||'')}">${esc(c.symbol||'↔')} ${esc(c.name)}<small>${esc(c.relationship||'Relationship context not added')}</small></a>`).join(''):'No connections added. Add only relationships supported by a reliable source.';document.getElementById('sourceCount').textContent=(d.evidence||[]).length+' source record(s)';document.getElementById('evidence').innerHTML=(d.evidence||[]).map(e=>{const u=safeUrl(e.url||'');return u?`<a class="source" href="${esc(u)}" target="_blank" rel="noopener">${esc(e.title||'Source record')} ↗<small>${esc(e.date||'Date not added')} · ${esc(e.type||'Source')}</small></a>`:`<div class="source">${esc(e.title||'Source record')}<small>${esc(e.date||'Date not added')} · URL not added</small></div>`}).join('')||'No evidence records added yet.';document.getElementById('limitations').textContent=d.limitations||'Association or shared attendance alone does not prove funding, direction or control.'}Promise.all([fetch('data/profiles.json').then(r=>r.ok?r.json():{}).catch(()=>({})),Promise.resolve().then(()=>{try{return JSON.parse(localStorage.getItem('networkEvidenceMapEditsV2')||'{}')}catch{return {}}})]).then(([remote,local])=>render({...defaults[id]||{name:'Profile',kind:'Profile',symbol:'●'},...(remote[id]||{}),...(local[id]||{})}));</script></body></html>
